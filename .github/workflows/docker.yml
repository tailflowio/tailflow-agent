name: CI

on:
  push:
    branches: ["*"]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Create web/dist placeholder for embed
        run: |
          mkdir -p web/dist/assets
          echo '<!DOCTYPE html><html><head><title>TailFlow</title></head><body></body></html>' > web/dist/index.html
          echo '// placeholder' > web/dist/assets/DashboardView-jnNJTy3N.js

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.10.1
          args: --config scripts/.golangci.yaml

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Create web/dist placeholder for embed
        run: |
          mkdir -p web/dist/assets
          echo '<!DOCTYPE html><html><head><title>TailFlow</title></head><body></body></html>' > web/dist/index.html
          echo '// placeholder' > web/dist/assets/DashboardView-jnNJTy3N.js

      - name: Run tests with coverage
        run: bash scripts/cover.sh

      - name: Check 100% coverage
        run: |
          TOTAL=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "Coverage: $TOTAL"
          if [ "$TOTAL" != "100.0%" ]; then
            echo "::error::Coverage is $TOTAL, expected 100.0%"
            exit 1
          fi

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout tailflow-shared
        uses: actions/checkout@v4
        with:
          repository: tailflowio/tailflow-shared
          path: tailflow-shared

      - name: Determine platforms
        id: platforms
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref_type }}" == "tag" ]]; then
            echo "value=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          else
            echo "value=linux/amd64" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: contains(steps.platforms.outputs.value, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=match,pattern=(\d+\.\d+\.\d+),group=1
            type=match,pattern=(\d+\.\d+)\.\d+,group=1
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Determine VERSION
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/package/Dockerfile
          platforms: ${{ steps.platforms.outputs.value }}
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  goreleaser:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
