version: "2.0"
name: "payment-sync"
description: "Paiement synchrone : le client HTTP attend le callback du provider avant de recevoir sa reponse"
tags: ["webhook", "payment", "sync"]

trigger:
  http:
    method: POST
    path: /pay

steps:
  - id: validate
    action: js
    title: "Valider la demande"
    config:
      script: |
        let body = trigger.body;
        if (!body || !body.amount) throw new Error("amount is required");
        if (!body.currency) throw new Error("currency is required");
        return {
          order_id: "ord_" + Math.random().toString(36).substr(2, 9),
          amount: body.amount,
          currency: body.currency,
        };

  - id: call-provider
    action: js
    title: "Appeler le provider"
    depends_on: [validate]
    config:
      script: |
        let order = steps.validate.output;
        // Simule l'appel au provider (Stripe, Mollie, etc.)
        return {
          tx_id: "tx_" + Math.random().toString(36).substr(2, 12),
          order_id: order.order_id,
          amount: order.amount,
          currency: order.currency,
          provider_status: "pending",
        };

  - id: wait-provider
    action: wait.webhook
    title: "Attendre le callback provider"
    depends_on: [call-provider]
    config:
      path: /provider-callback
      timeout: 5m

  - id: build-response
    action: js
    title: "Construire la reponse"
    depends_on: [wait-provider]
    config:
      script: |
        let provider = steps["call-provider"].output;
        let callback = steps["wait-provider"].output;
        let cb = callback.body || {};
        let paid = cb.status === "paid" || cb.status === "success";
        return {
          order_id: provider.order_id,
          tx_id: provider.tx_id,
          amount: provider.amount,
          currency: provider.currency,
          paid: paid,
          provider_response: cb,
        };

  - id: respond
    action: response
    title: "Repondre au client"
    depends_on: [build-response]
    config:
      status: 200
      body:
        order_id: "{{ steps.build-response.output.order_id }}"
        tx_id: "{{ steps.build-response.output.tx_id }}"
        amount: "{{ steps.build-response.output.amount }}"
        currency: "{{ steps.build-response.output.currency }}"
        paid: "{{ steps.build-response.output.paid }}"
        provider_response: "{{ steps.build-response.output.provider_response }}"
