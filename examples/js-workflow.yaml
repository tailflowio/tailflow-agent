version: "2.0"
name: "js-workflow"
description: "Demonstrates JavaScript scripting with goja"
tags: ["example", "js"]

steps:
  - id: compute
    action: js
    title: "Compute fibonacci"
    config:
      script: |
        function fib(n) {
          if (n <= 1) return n;
          return fib(n - 1) + fib(n - 2);
        }
        return { result: fib(10), message: "Fibonacci(10) = " + fib(10) };

  - id: log_result
    action: log
    title: "Log result"
    depends_on: [compute]
    config:
      message: "{{ steps.compute.output.message }}"

  - id: condition_check
    action: condition
    title: "Check if result > 50"
    depends_on: [compute]
    config:
      if: "steps.compute.output.result > 50"
      then: "Result is greater than 50"
      else: "Result is 50 or less"

  - id: final
    action: log
    title: "Final log"
    depends_on: [log_result, condition_check]
    config:
      message: "Condition result: {{ steps.condition_check.output.branch }}"
