version: "2.0"
name: "order-confirmation"
description: "Create an order and wait for confirmation via RabbitMQ"
tags: ["rabbitmq", "order"]

trigger:
  http:
    method: POST
    path: /orders

steps:
  - id: validate-input
    action: validate
    title: "Validate request"
    config:
      data: "{{ trigger.body }}"
      rules:
        product: "required"

  - id: create-order
    action: set
    title: "Create order"
    depends_on: [validate-input]
    config:
      order_id: "{{ uuid() }}"
      product: "{{ trigger.body.product }}"
      quantity: "{{ trigger.body.quantity ?? 1 }}"
      status: "pending"

  - id: wait-confirmation
    action: wait.rabbitmq
    title: "Wait for confirmation"
    depends_on: [create-order]
    config:
      url: "{{ env.RABBITMQ_URL }}"
      queue: "order.confirmations"
      match: "order_id"
      match_value: "{{ vars.order_id }}"
      timeout: "5m"

  - id: respond
    action: response
    title: "Send response"
    depends_on: [wait-confirmation]
    config:
      status: 200
      body:
        order_id: "{{ vars.order_id }}"
        product: "{{ vars.product }}"
        payment_status: "{{ steps.wait-confirmation.output.body.status }}"
