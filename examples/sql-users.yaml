version: "2.0"
name: "sql-users"
description: "Query users from PostgreSQL and return as HTTP response"
tags: ["sql", "api"]

trigger:
  http:
    method: GET
    path: /api/public/users

stages:
  - name: query
    description: "Fetch data from the database"
  - name: respond
    description: "Return the HTTP response"

steps:
  - id: fetch
    action: sql.query
    stage: query
    title: "Fetch active users"
    config:
      dsn: "{{ env.DATABASE_URL }}"
      query: "SELECT id, name, email FROM users WHERE status = $1 ORDER BY name"
      params: ["active"]

  - id: respond
    action: response
    stage: respond
    title: "Return users"
    depends_on: [fetch]
    config:
      status: 200
      body:
        users: "{{ steps.fetch.output.rows }}"
        count: "{{ steps.fetch.output.count }}"
