version: "2.0"
name: "deploy-service"
description: "Build, test, and deploy a microservice"
tags: ["deploy", "ci"]
author: "team@company.com"

params:
  - name: environment
    type: string
    required: true
    default: "staging"
  - name: dry_run
    type: bool
    default: true

env:
  API_BASE: "https://api.{{ params.environment }}.example.com"

stages:
  - name: build
    description: "Checkout and compile the service"
  - name: test
    description: "Run the test suite"
  - name: deploy
    description: "Deploy the binary to the target environment"
  - name: notify
    description: "Notify the team of deployment completion"

steps:
  - id: checkout
    action: log
    stage: build
    title: "Checkout code"
    config:
      message: "Checking out code..."

  - id: build
    action: log
    stage: build
    title: "Build binary"
    depends_on: [checkout]
    config:
      message: "Building for {{ params.environment }}..."

  - id: test
    action: log
    stage: test
    title: "Run tests"
    depends_on: [checkout]
    config:
      message: "Running tests..."

  - id: deploy
    action: log
    stage: deploy
    title: "Deploy to {{ params.environment }}"
    when: "params.dry_run == false"
    depends_on: [build, test]
    config:
      message: "Deploying to {{ params.environment }}..."

  - id: notify
    action: log
    stage: notify
    title: "Notify team"
    depends_on: [deploy]
    config:
      message: "Deploy complete on {{ params.environment }}"
