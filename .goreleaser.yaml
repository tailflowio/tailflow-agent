version: 2

git:
  tag_sort: -version:refname
  prerelease_suffix: "-"

before:
  hooks:
    - bash -c "cd web/frontend && npm install && npx vite build"
    - go mod tidy
builds:
  - main: ./cmd/tailflow
    binary: tailflow
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}
    hooks:
      post:
        - cmd: upx --best --lzma {{ .Path }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

homebrew_casks:
  - name: tailflow
    directory: Casks
    repository:
      owner: tailflowio
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    url:
      verified: github.com/tailflowio/tailflow-agent
    homepage: "https://github.com/tailflowio/tailflow-agent"
    description: "TailFlow workflow engine"
    license: "MIT"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: tailflowio
    name: tailflow-agent
  name_template: "{{ .Tag }}"
